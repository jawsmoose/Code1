name: iOS Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build PaycheckPilot (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project PaycheckPilot.xcodeproj \
            -target PaycheckPilot \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES
